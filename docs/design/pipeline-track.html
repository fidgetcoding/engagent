<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Engagent · Pipeline Track</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter+Tight:wght@400..700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html{--spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.22,.9,.24,1);--r-pill:999px;--pad:26px 34px 48px;--lab:270px}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
input{font:inherit;color:inherit;border:0;background:none;outline:0;min-width:0}
a{color:inherit;text-decoration:none;cursor:pointer}
h1,h2,h3,p{margin:0}
.ic{width:16px;height:16px;flex:none}
.app{display:grid;min-height:100vh}
#view{min-width:0;padding:var(--pad)}
/* top */
.top{display:flex;align-items:center;gap:14px;min-width:0}
.logo{display:inline-flex;align-items:center;flex:none;line-height:1}
.ws{display:inline-flex;align-items:center;gap:9px;padding:5px 12px 5px 5px;border-radius:var(--r-pill);background:var(--surface);box-shadow:var(--sh-s);transition:transform .35s var(--spring)}
.ws:active{transform:scale(.97)}
.ws-mark{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#3E5A3A;color:#F4E9D8;font-weight:700;font-size:13px}
.ws-t{display:flex;flex-direction:column;line-height:1.15}.ws-t b{font-size:13px;font-weight:650;white-space:nowrap}.ws-t small{font-size:11px;color:var(--mute)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:14px}
.search{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:var(--r-pill);background:var(--surface);box-shadow:var(--sh-s);width:270px;color:var(--mute)}
.search input{width:100%;color:var(--ink)}.search input::placeholder{color:var(--mute)}
.agent-st{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--mute);white-space:nowrap}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ok,#3BA55C);box-shadow:0 0 0 0 var(--ok,#3BA55C);animation:pulse 2.4s var(--ease) infinite;display:inline-block}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok,#3BA55C) 50%,transparent)}70%,100%{box-shadow:0 0 0 7px transparent}}
.seats{display:flex}.seats .av{margin-left:-6px;box-shadow:0 0 0 2px var(--bg)}
/* nav */
.nv{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--mute);transition:all .4s var(--spring);white-space:nowrap}
.nv .ic{width:20px;height:20px}
.nv kbd{font:600 10px var(--mono)}
/* page head */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:20px}
.ph-t{min-width:0}
.ph h1{font:var(--h1w,700) var(--h1s,32px)/1.05 var(--disp,var(--font));letter-spacing:var(--h1t,-.025em);white-space:nowrap}
.ph p{color:var(--mute);margin-top:8px;max-width:72ch;text-wrap:pretty}
.ph-a{display:flex;gap:10px;align-items:center;flex:none}
.sched{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:var(--r-pill);background:var(--surface);box-shadow:var(--sh-s);font-size:13px;font-weight:600;white-space:nowrap}
/* tool */
.tool{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.tool-note{color:var(--mute);font-size:13px}
.seg{display:inline-flex;gap:2px;padding:4px;background:var(--seg);border-radius:var(--r-pill)}
.seg button{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:var(--r-pill);color:var(--mute);font-weight:600;font-size:13px;transition:background .35s var(--ease),color .35s,box-shadow .35s,transform .35s var(--spring)}
.seg button:active{transform:scale(.95)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-s)}
.seg button em{font-style:normal;font:600 11px var(--mono);opacity:.7}
.seg.sm button{padding:5px 11px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fb{display:inline-flex;align-items:center;gap:6px;padding:7px 10px 7px 13px;border-radius:var(--r-pill);background:var(--surface);box-shadow:var(--sh-s);font-size:13px;transition:transform .35s var(--spring)}
.fb:active{transform:scale(.95)}.fb span{color:var(--mute)}.fb b{font-weight:600}.fb .ic{width:14px;height:14px;color:var(--mute)}
.fb.set{background:var(--soft);color:var(--acc-ink)}.fb.set span{color:var(--acc-ink);opacity:.75}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:var(--r-pill);background:var(--surface);box-shadow:var(--sh-s);font-weight:650;font-size:13px;white-space:nowrap;transition:transform .35s var(--spring),box-shadow .35s,background .3s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.95)}
.btn.pri{background:var(--acc);color:var(--on-acc,#fff)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{padding:6px 12px;font-size:12px}
.tool>.btn.pri{margin-left:auto}
/* tags */
.tg{display:inline-flex;align-items:center;font-size:11px;font-weight:650;padding:3px 8px;border-radius:var(--r-pill);background:var(--chip);color:var(--ink2,var(--ink));white-space:nowrap;line-height:1.3}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:9.5px;font-weight:750;color:#fff;background:var(--c);flex:none;letter-spacing:.02em}
.av-ava{--c:var(--s1)}.av-jun{--c:var(--s2)}.av-mika{--c:var(--s3)}.av-sol{--c:var(--s4)}
.t-due,.t-tasks,.t-refs,.t-com{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--mute);white-space:nowrap;font-weight:550}
.t-due .ic,.t-tasks .ic,.t-refs .ic,.t-com .ic{width:13px;height:13px}
.t-due.soon{color:var(--acc-ink)}.t-due.late{color:var(--bad)}
.t-warn{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;color:var(--warn-ink);white-space:nowrap}.t-warn .ic{width:13px;height:13px}
.t-appr{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;white-space:nowrap}
.t-appr i{width:7px;height:7px;border-radius:50%;background:currentColor}
.ap-pending{color:var(--warn-ink)}.ap-approved{color:var(--ok-ink)}.ap-changes-requested{color:var(--bad)}
.plats{display:inline-flex;gap:3px}
.pl{font:700 9px var(--mono);font-style:normal;padding:2px 4px;border-radius:5px;background:var(--chip);color:var(--mute);letter-spacing:.02em}
.prog{display:block;height:6px;border-radius:9px;background:var(--track);overflow:hidden}.prog i{display:block;height:100%;background:var(--acc);border-radius:inherit}
.note{font-size:12.5px;color:var(--mute);line-height:1.4}
/* board */
.bwrap{overflow-x:auto;margin:0 -10px;padding:6px 10px 20px;scrollbar-width:thin}
.board{display:grid;grid-template-columns:repeat(7,minmax(var(--colw,190px),1fr));gap:var(--colgap,12px);align-items:start}
.col{min-width:0}
.col-h{display:flex;align-items:center;gap:8px}
.col-n{font-weight:700;white-space:nowrap}
.col-c{font:600 11px var(--mono);color:var(--mute)}
.col-note{font-size:11.5px;color:var(--mute)}
.col-b{display:grid;gap:var(--cardgap,10px)}
.card{position:relative;min-width:0}
.card h3{font-size:14px;line-height:1.3;font-weight:680;text-wrap:pretty}
.empty{font-size:12.5px;color:var(--mute);padding:18px 10px;text-align:center}
.empty.big{padding:60px;font-size:15px}
/* list */
.lgs{display:flex;align-items:center;gap:10px;margin-bottom:12px;color:var(--mute);font-size:13px;font-weight:600}
.lrow{display:grid;grid-template-columns:minmax(260px,2.4fr) 90px 110px 150px 120px 130px;gap:14px;align-items:center;padding:11px 16px}
.lhead{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mute);padding-top:0;padding-bottom:6px}
.lc-t{display:flex;flex-direction:column;min-width:0}.lc-t b{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lc-t small{color:var(--mute);font-size:12px}
.lw{font-style:normal;color:var(--warn-ink);font-weight:650}
.lc-p{display:flex;align-items:center;gap:8px}.lc-p .prog{flex:1}.lc-p em{font:600 11.5px var(--mono);font-style:normal;color:var(--mute)}
.lc-a{display:flex;align-items:center;gap:7px}.lc-a em{font-style:normal;font-size:13px}
.lgrp h3{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:16px 16px 6px}.lgrp h3 span{font:600 11px var(--mono);color:var(--mute)}
.lempty{padding:10px 16px 12px;color:var(--mute);font-size:13px}
/* timeline */
.tl-leg{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-bottom:12px;font-weight:550}
.tl-leg span{display:inline-flex;align-items:center;gap:7px}
.tl-leg i{display:inline-block}
.lg-bar{width:22px;height:10px;border-radius:5px;background:var(--bar)}.lg-fill{width:22px;height:10px;border-radius:5px;background:var(--acc)}
.lg-slot{width:9px;height:9px;transform:rotate(45deg);border:2px solid var(--ink);border-radius:2px}.lg-now{width:2px;height:13px;background:var(--now)}
.tlw{overflow-x:auto;padding-bottom:10px}
.tl{position:relative;min-width:1060px}
.tl-row{display:grid;grid-template-columns:var(--lab) 1fr;align-items:center;min-height:52px}
.tl-lab{display:flex;align-items:center;gap:10px;padding:0 14px;min-width:0}
.tl-lab span{display:flex;flex-direction:column;min-width:0}.tl-lab b{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tl-lab small{font-size:11.5px;color:var(--mute)}
.tl-track{position:relative;height:52px;background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px);background-size:calc(100%/21) 100%}
.tl-h .tl-track{display:grid;grid-template-columns:repeat(21,1fr);height:48px;background:none}
.tl-d{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;line-height:1.1}
.tl-d b{font-weight:650}.tl-d small{font-size:10px;color:var(--mute)}.tl-d.we{color:var(--mute)}
.tl-d.now b{color:var(--now)}
.tl-bar{position:absolute;top:12px;height:28px;border-radius:var(--r-pill);background:var(--bar);overflow:hidden;display:flex;align-items:center}
.tl-bar i{position:absolute;inset:0 auto 0 0;background:var(--acc);border-radius:inherit}
.tl-bar em{position:relative;margin-left:auto;margin-right:10px;font:650 11px var(--mono);font-style:normal;color:var(--ink)}
.tl-slot{position:absolute;top:0;height:52px;display:flex;align-items:center;transform:translateX(-50%)}
.tl-slot i{width:11px;height:11px;transform:rotate(45deg);background:var(--surface);border:2px solid var(--ink);border-radius:2px}
.tl-slot em{position:absolute;left:18px;white-space:nowrap;font-size:11px;font-style:normal;color:var(--mute);font-weight:550}
.tl-pt{position:absolute;top:17px;display:flex;align-items:center;gap:8px;transform:translateX(-9px)}
.tl-pt i{width:18px;height:18px;border-radius:50%;background:var(--ok-ink);box-shadow:0 0 0 4px var(--surface)}
.tl-pt em{font-size:11.5px;font-style:normal;font-weight:600;color:var(--ok-ink);white-space:nowrap}
.tl-now{position:absolute;top:0;bottom:0;width:2px;background:var(--now);pointer-events:none}
.tl-now span{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);background:var(--now);color:#fff;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:var(--r-pill);white-space:nowrap}
/* calendar */
.cal{overflow-x:auto}
.cal-h,.cal-g{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;min-width:960px}
.cal-h span{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mute);padding:0 10px 6px}
.cal-c{min-height:128px;padding:10px;display:flex;flex-direction:column;gap:6px}
.cal-c>b{font-size:13px;font-weight:650}.cal-c.past>b{color:var(--mute)}
.cal-it{padding:7px 9px;border-radius:12px;background:var(--surface);box-shadow:var(--sh-s);display:flex;flex-direction:column;font-size:12px;line-height:1.25}
.cal-it span{font-weight:650}.cal-it small{color:var(--mute);font-size:11px;margin-top:2px}
/* trends */
.tcat{margin-bottom:28px}
.tcat h2{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;margin-bottom:12px}
.tcat h2 span{font:600 11px var(--mono);color:var(--mute)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.tc{display:flex;flex-direction:column;min-width:0}
.cover{position:relative;overflow:hidden}
.cover .art{display:block;width:100%;height:100%}
.ox{position:absolute;left:12px;top:12px;font:700 13px var(--mono);padding:4px 9px;border-radius:var(--r-pill);background:var(--surface);color:var(--ink)}
.tc-b{display:flex;flex-direction:column;gap:9px;min-width:0}
.tc-a{color:var(--mute);font-size:12px}
.tc h3{font-size:16px;line-height:1.25;font-weight:700;text-wrap:pretty}
.tc-st,.fc-st{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute)}
.tc-st span,.fc-st span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}.tc-st b,.fc-st b{color:var(--ink);font-weight:700}
.tc-st .ic,.fc-st .ic{width:14px;height:14px}
.flip{font-size:13px;line-height:1.4}.flip b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin-bottom:2px;font-weight:700}
.tc-f{display:flex;align-items:center;gap:10px;margin-top:auto}
.tc-btns{margin-left:auto;display:flex;gap:6px;align-items:center}
.diff{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:var(--r-pill)}
.d-Easy{background:var(--ok-soft);color:var(--ok-ink)}.d-Medium{background:var(--warn-soft);color:var(--warn-ink)}.d-Hard{background:var(--bad-soft);color:var(--bad)}
.tstate{font-size:12.5px;font-weight:700}.st-picked{color:var(--ok-ink)}.st-passed{color:var(--mute)}
/* formats */
.fbody{display:grid;gap:14px}
.fc{display:grid;grid-template-columns:260px 1fr auto;gap:26px;align-items:center}
.fc-ex{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;position:relative}
.fc-ex small{position:absolute;bottom:-20px;left:0;font-size:11px;color:var(--mute);font-weight:600}
.ex{aspect-ratio:4/5;overflow:hidden}.ex .art{width:100%;height:100%;display:block}
.fc-b{display:flex;flex-direction:column;gap:9px;min-width:0}
.fc-k{display:flex;gap:8px;font-size:12px;color:var(--mute);font-weight:600}
.mk{font:700 10.5px var(--mono);padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--ink)}
.fc h3{font-size:19px;font-weight:700;line-height:1.2}
.fc-snd{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute)}.fc-snd .ic{width:14px;height:14px}
.fc-r{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.mom{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;padding:6px 12px;border-radius:var(--r-pill)}
.mo-Rising{background:var(--ok-soft);color:var(--ok-ink)}.mo-Steady{background:var(--chip);color:var(--ink)}.mo-Fading{background:var(--bad-soft);color:var(--bad)}
/* performance */
.note-bar{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--warn-ink);background:var(--warn-soft);padding:9px 14px;border-radius:14px;margin-bottom:14px}
.pgrid{display:grid;gap:16px;grid-template-columns:repeat(12,1fr);grid-template-areas:"k k k k k k k k k k k k" "g g g g g g g g p p p p" "g g g g g g g g w w w w" "t t t t t t t t h h h h" "t t t t t t t t c c c c"}
.kpis{grid-area:k}.grow{grid-area:g}.plat{grid-area:p}.wk{grid-area:w}.tops{grid-area:t}.hl{grid-area:h}.conn{grid-area:c}
.pc{min-width:0}
.pc-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}.pc-h h3{font-size:15px;font-weight:700}.pc-h span{font-size:12px;color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.kpi{display:flex;flex-direction:column;gap:3px}.kpi small{font-size:12px;color:var(--mute);font-weight:600}.kpi b{font-size:28px;font-weight:750;letter-spacing:-.02em;line-height:1.1}
.dl{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700}.dl .ic{width:13px;height:13px}.dl em{font-style:normal;font-weight:500;color:var(--mute);margin-left:3px}
.dl.up{color:var(--ok-ink)}.dl.dn{color:var(--bad)}
.lt{font-style:normal;font-size:12px;color:var(--mute)}
.big{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}.big b{font-size:34px;font-weight:750;letter-spacing:-.025em}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ln{fill:none;stroke:var(--acc);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--soft)}
.chart .end{fill:var(--acc);stroke:var(--surface);stroke-width:3}
.chart .dt{fill:var(--acc);opacity:.35}
.chart .br{fill:var(--bar)}
.ax{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);margin-top:6px}
.pp{margin-bottom:14px}.pp-t{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:6px}.pp-t span{color:var(--mute);font-size:12px}
.pbar{display:block;height:12px;border-radius:9px;background:var(--track);overflow:hidden}.pbar i{display:block;height:100%;background:var(--acc);border-radius:inherit}
.wks{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.wd span{height:112px;width:100%;display:flex;align-items:flex-end;background:var(--track);border-radius:10px;overflow:hidden}
.wd span i{display:block;width:100%;background:var(--bar);border-radius:10px}
.wd.best span i{background:var(--acc)}.wd em{font:650 10.5px var(--mono);font-style:normal;color:var(--mute)}.wd b{font-size:12px;font-weight:650}
.hls{display:grid;gap:12px}.hli{display:flex;flex-direction:column;gap:2px}.hli small{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}.hli b{font-size:14px;font-weight:650}.hli span{font-size:12.5px;color:var(--mute)}
.tpr{display:grid;grid-template-columns:minmax(200px,2.2fr) repeat(5,1fr) 70px;gap:10px;align-items:center;padding:10px 0;font-size:13px}
.tpr>span:first-child{display:flex;flex-direction:column;min-width:0}.tpr b{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tpr small{color:var(--mute);font-size:11.5px}
.tph{font:600 10.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--mute);padding-top:0}
.tpr:not(.tph)>span:not(:first-child){font-family:var(--mono);font-size:12.5px}
.xm{justify-self:end;font:750 12.5px var(--mono);padding:4px 9px;border-radius:var(--r-pill)}.xm.hi{background:var(--ok-soft);color:var(--ok-ink)}.xm.lo{background:var(--chip);color:var(--mute)}
.cn{display:flex;align-items:center;gap:11px;padding:9px 0}
.cn .dot{width:10px;height:10px;border-radius:50%;flex:none}
.cs-ok .dot{background:var(--ok-ink)}.cs-warn .dot{background:var(--warn-ink)}.cs-off .dot{background:var(--line)}
.cn-t{display:flex;flex-direction:column;flex:1;min-width:0}.cn-t b{font-size:13.5px}.cn-t small{font-size:11.5px;color:var(--mute)}
.ok{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ok-ink);font-weight:650}.ok .ic{width:13px;height:13px}
/* directions */
.dgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.dc{grid-column:span 4;min-width:0}
.dc-h{margin-bottom:12px}.dc-h h3{font-size:15px;font-weight:700}.dc-h p{font-size:12.5px;color:var(--mute);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 6px 6px 11px;border-radius:var(--r-pill);background:var(--chip);font-size:13px;font-weight:600}
.chip .ic{width:14px;height:14px;color:var(--mute)}
.chip button{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--mute);transition:background .2s}.chip button:hover{background:var(--surface)}.chip button .ic{width:12px;height:12px}
.chip.neg{background:var(--bad-soft);color:var(--bad)}.chip.neg .ic{color:var(--bad)}
.add{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--r-pill);box-shadow:inset 0 0 0 1.5px var(--line);font-size:13px;color:var(--mute)}.add input{width:62px}.add .ic{width:13px;height:13px}
.tog-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--r-pill);font-size:13px;font-weight:600;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--mute);transition:all .35s var(--spring)}
.tog-chip .ic{width:14px;height:14px;opacity:0;margin-left:-20px;transition:all .35s var(--spring)}
.tog-chip.on{background:var(--acc);color:var(--on-acc,#fff);box-shadow:none}.tog-chip.on .ic{opacity:1;margin-left:0}
.refl{display:grid;gap:9px;justify-items:start}
.ref{display:flex;gap:11px;align-items:center;width:100%}
.ref-t{width:40px;height:50px;border-radius:10px;overflow:hidden;flex:none}.ref-t .art{width:100%;height:100%;display:block}
.ref>span:last-child{display:flex;flex-direction:column;min-width:0}.ref b{font-size:13.5px}.ref small{display:flex;gap:4px;align-items:center;font:500 11.5px var(--mono);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ref small .ic{width:12px;height:12px}
.pls{display:grid;gap:8px}
.pltog{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--chip)}
.pltog b{font-size:13.5px;flex:1;font-weight:600}.pltog:not(.on) b{color:var(--mute)}
.pltog .sw{width:40px;height:24px;border-radius:var(--r-pill);background:var(--line);position:relative;transition:background .3s}
.pltog .sw i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .45s var(--spring)}
.pltog.on .sw{background:var(--acc)}.pltog.on .sw i{transform:translateX(16px)}
.capn{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}.capn b{font-size:30px;font-weight:750;letter-spacing:-.02em}.capn span{color:var(--mute);font-size:13px}
.cbar{display:block;height:14px;border-radius:9px;background:var(--track);overflow:hidden;margin-bottom:14px}.cbar i{display:block;height:100%;background:var(--acc);border-radius:inherit}
.capr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.capr span{display:flex;flex-direction:column}.capr small{font-size:11.5px;color:var(--mute)}.capr b{font:700 15px var(--mono)}
.schl{display:grid;gap:8px}.sc{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}.sc:last-child{border:0}.sc span{display:flex;gap:9px;align-items:center}.sc b{font-weight:600;font-size:13.5px}.sc em{font:600 12.5px var(--mono);font-style:normal}
/* telegram */
.tgw{display:grid;grid-template-columns:400px 1fr;gap:44px;align-items:start}
.phone{border-radius:44px;padding:12px;display:flex;flex-direction:column;height:680px}
.ph-bar{display:flex;align-items:center;gap:10px;padding:10px 14px 12px}
.ph-bar>span:last-child{display:flex;flex-direction:column;line-height:1.2}.ph-bar b{font-size:14px}.ph-bar small{font-size:11.5px;color:var(--mute)}
.tg-av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;overflow:hidden}
.chat{flex:1;overflow:auto;padding:12px 12px 6px;display:flex;flex-direction:column;gap:7px;scrollbar-width:none}
.m{max-width:84%;font-size:13.5px;line-height:1.4}
.m p{padding:8px 12px;border-radius:18px}
.m.me{align-self:flex-end}.m.ag{align-self:flex-start}
.find{margin-top:6px;border-radius:16px;overflow:hidden;display:grid;grid-template-columns:86px 1fr;background:var(--surface)}
.find-c{position:relative;height:108px}.find-c .art{width:100%;height:100%;display:block}.find-c .ox{left:6px;top:6px;font-size:11px;padding:2px 6px}
.find-b{padding:9px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}.find-b small{font-size:10.5px;color:var(--mute)}.find-b b{font-size:13px;line-height:1.25}.find-b span{font-size:11.5px;color:var(--mute)}.find-b em{font-style:normal;font-size:11.5px;margin-top:2px}
.kb{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:5px}
.kb button{padding:8px;border-radius:12px;text-align:center;font-weight:650;font-size:13px;transition:transform .3s var(--spring)}.kb button:active{transform:scale(.95)}
.ph-in{display:flex;align-items:center;justify-content:space-between;margin:6px;padding:11px 16px;border-radius:var(--r-pill);color:var(--mute);font-size:13.5px}.ph-in .ic{color:var(--acc)}
.tgs h2{font-size:19px;font-weight:700;margin-bottom:18px;white-space:nowrap}
.fx{display:grid;grid-template-columns:34px 1fr;gap:14px;margin-bottom:22px}
.fx-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--mono)}
.fx b{font-size:15px}.fx p{color:var(--mute);font-size:13.5px;margin:3px 0 10px;max-width:56ch}
.fx-card{max-width:300px;margin-bottom:10px}
.lnk{display:inline-flex;align-items:center;gap:6px;font-weight:650;font-size:13px;color:var(--acc-ink);margin-top:8px}.lnk .ic{width:14px;height:14px;transition:transform .35s var(--spring)}.lnk:hover .ic{transform:translateX(3px)}
/* pop + toast */
#pop{position:fixed;z-index:40;min-width:200px;padding:6px;border-radius:18px;background:var(--surface);box-shadow:0 24px 50px -18px rgba(40,25,10,.35),0 0 0 1px var(--line);opacity:0;transform:translateY(-6px) scale(.97);transform-origin:top left;pointer-events:none;transition:opacity .2s,transform .35s var(--spring)}
#pop.on{opacity:1;transform:none;pointer-events:auto}
#pop button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:9px 12px;border-radius:12px;font-size:13.5px;font-weight:550}
#pop button:hover{background:var(--chip)}#pop button.on{font-weight:700}#pop button .ic{width:14px;height:14px;color:var(--acc)}
#toast{position:fixed;z-index:50;right:24px;bottom:24px;display:flex;gap:9px;align-items:center;padding:12px 18px;border-radius:var(--r-pill);background:var(--ink);color:var(--bg);font-weight:600;font-size:13.5px;opacity:0;transform:translateY(20px) scale(.9);transition:opacity .25s,transform .5s var(--spring);pointer-events:none}
#toast.on{opacity:1;transform:none}#toast .ic{color:var(--acc)}
/* motion */
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.intro .card,.intro .tc,.intro .fc,.intro .kpi,.intro .lrow,.intro .dc,.intro .pc,.intro .m{animation:up .7s var(--spring) both;animation-delay:calc(var(--i,0) * 40ms + 80ms)}
.intro .m:nth-child(n){--i:0}.intro .m:nth-child(2){--i:3}.intro .m:nth-child(3){--i:6}.intro .m:nth-child(4){--i:9}.intro .m:nth-child(5){--i:12}.intro .m:nth-child(6){--i:15}.intro .m:nth-child(7){--i:18}
::view-transition-group(*){animation-duration:.55s;animation-timing-function:cubic-bezier(.3,1.25,.5,1)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.28s}
.thumb *{animation:none!important;transition:none!important}
/* mobile */
@media (max-width:760px){
 html{--pad:16px 16px 110px}
 .app{display:block!important}
 .top{padding:12px 16px!important;flex-wrap:wrap;gap:10px!important}
 .top-r .search,.seats,.agent-st{display:none!important}
 .nav{position:static!important;display:flex!important;flex-direction:row!important;overflow-x:auto;gap:6px!important;padding:8px 16px!important;margin:0!important;height:auto!important;min-height:0!important;align-items:center!important;width:auto!important;border-radius:0!important;transform:none!important;left:auto!important;bottom:auto!important;box-shadow:none!important;background:transparent!important;scrollbar-width:none;writing-mode:horizontal-tb!important}
 .nav .nv{flex:none;flex-direction:row!important;writing-mode:horizontal-tb!important;transform:none!important;padding:8px 12px!important;width:auto!important;height:auto!important;margin:0!important}
 .nav .nv .ic{width:16px!important;height:16px!important}
 .nav-brand,.nav .buddy,.nav .navfoot{display:none!important}
 .ph{flex-direction:column;align-items:flex-start;gap:12px}.ph h1{font-size:26px!important}
 .tool{gap:8px}.seg.vs button span{display:none}.filters{width:100%}.tool>.btn.pri{margin-left:0}
 .board{grid-template-columns:repeat(7,80vw)!important;grid-auto-flow:column;grid-template-rows:none!important;display:grid!important}
 .bwrap{scroll-snap-type:x mandatory}.col{scroll-snap-align:start}
 .tgw,.fc{grid-template-columns:1fr}.dc{grid-column:1/-1!important}.pgrid{display:flex!important;flex-direction:column}.kpis{grid-template-columns:repeat(2,1fr)!important}
}


/* ==== a5 · Pipeline Track — skin ==== */
:root{--bg:#F4F5F9;--surface:#FFFFFF;--ink:#111326;--ink2:#2E3250;--mute:#6A6F87;--line:#E2E4EE;--line2:#D3D6E4;
--acc:#4B3BFF;--acc-ink:#3A2BE0;--soft:#ECEAFF;--teal:#10B3A3;--teal-ink:#0A8478;--sun:#FFC53D;--sun-ink:#8A5A00;--sun-soft:#FFF3D1;
--seg:#E9EBF2;--track:#ECEEF4;--chip:#F1F2F7;--grid:#ECEEF4;--bar:#DCD8FF;--now:#4B3BFF;
--ok:#10B3A3;--ok-ink:#0A8478;--ok-soft:#DDF5F2;--warn-ink:#9A6300;--warn-soft:#FFF3D1;--bad:#D93A4A;--bad-soft:#FDE6E8;
--s1:#4B3BFF;--s2:#0E9C8F;--s3:#C98500;--s4:#111326;
--sh:0 1px 0 rgba(17,19,38,.04),0 1px 2px rgba(17,19,38,.06),0 10px 24px -14px rgba(32,26,120,.22);
--sh-s:0 1px 2px rgba(17,19,38,.06),0 4px 10px -6px rgba(32,26,120,.18);
--sh-l:0 1px 2px rgba(17,19,38,.06),0 18px 40px -20px rgba(32,26,120,.35),0 40px 80px -50px rgba(75,59,255,.35);
--font:'Inter Tight',system-ui,sans-serif;--mono:'DM Mono',ui-monospace,monospace;--disp:'Archivo','Inter Tight',sans-serif;
--h1s:40px;--h1w:800;--h1t:-.03em;--colw:152px;--colgap:10px;--pad:22px 32px 56px;--spring:cubic-bezier(.3,1.3,.5,1)}
body{background:radial-gradient(1100px 520px at 100% -10%,#E7E4FF 0,rgba(231,228,255,0) 60%),radial-gradient(800px 420px at 20% 115%,#DDF3F0 0,rgba(221,243,240,0) 60%),var(--bg);font-feature-settings:"ss01","cv11"}
.ph h1,.stop .col-n,.start b,.h5n,.fb5 h3,.moves h2,.tn,.kr-t b,.capn b,.lgx,.tcat h2,.lvl,.logged5 b,.mv-b>b,.tc h3,.fst b,.big b{font-family:var(--disp);font-stretch:112%}
.ph h1{font-weight:800;letter-spacing:-.035em}
.ph p{color:var(--mute)}
::selection{background:var(--soft)}
/* shell */
.app{grid-template-columns:240px 1fr;grid-template-rows:auto 1fr;grid-template-areas:"nav top" "nav view"}
.top{grid-area:top;padding:20px 32px 4px}
#view{grid-area:view}
.nav{grid-area:nav;position:sticky;z-index:30;top:16px;align-self:start;margin:16px 0 16px 16px;height:calc(100vh - 32px);min-height:600px;display:flex;flex-direction:column;gap:2px;padding:20px 10px 14px;border-radius:22px;background:rgba(255,255,255,.78);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);box-shadow:0 0 0 1px rgba(255,255,255,.9) inset,0 0 0 1px var(--line),0 24px 50px -30px rgba(32,26,120,.35)}
.nav-brand{display:flex;flex-direction:column;align-items:flex-start;gap:18px;padding:2px 6px 18px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.nav-brand .logo{padding-left:4px}.nav-brand .ws{width:100%;box-shadow:0 0 0 1px var(--line)}.nav-brand .ws svg{margin-left:auto;color:var(--mute)}
.ws{border-radius:12px;padding:5px 10px 5px 5px}
.ws-mark{border-radius:9px;background:#3E5A3A;color:#F4E9D8}
.nav .nv{gap:12px;padding:6px 8px;border-radius:12px;font-size:14px;font-weight:600;color:var(--ink2);transition:background .3s var(--ease),color .3s var(--ease)}
.nav .nv .ic{width:34px;height:34px;padding:8px;flex:none;border-radius:10px;background:var(--chip);color:var(--ink2);transition:transform .45s var(--spring),background .3s,color .3s}
.nav .nv span{transition:transform .45s var(--spring)}
.nav .nv:hover{background:rgba(17,19,38,.035)}
.nav .nv:hover .ic{transform:translateX(2px)}
.nav .nv:hover span{transform:translateX(3px)}
.nav .nv.on{background:var(--soft);color:var(--acc-ink)}
.nav .nv.on .ic{background:var(--acc);color:#fff;box-shadow:0 6px 14px -6px rgba(75,59,255,.7)}
.nav .nv:last-of-type{margin-top:auto}
/* wordmark: two stations on one line */
.lgx{display:inline-flex;align-items:center;font-size:25px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--ink)}
.lgx b{font-weight:800}
.lgx em{font-style:normal;font-weight:800;color:var(--acc)}
.lgx i{position:relative;display:inline-block;width:20px;height:12px;margin:2px 4px 0}
.lgx i::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;border-radius:2px;background:linear-gradient(90deg,var(--ink),var(--acc))}
.lgx i::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff;border:2px solid var(--acc)}
/* top */
.search{border-radius:12px;box-shadow:0 0 0 1px var(--line);background:rgba(255,255,255,.8)}
.seats .av{box-shadow:0 0 0 2px var(--bg)}
.island{display:inline-flex;align-items:center;gap:10px;padding:8px 16px 8px 12px;border-radius:12px;background:var(--ink);color:#fff;font-size:13px;font-weight:550;max-width:460px;min-width:0;box-shadow:0 12px 24px -14px rgba(17,19,38,.6)}
.island .pulse{flex:none;--ok:var(--sun)}
.isl-w{overflow:hidden;display:block;min-width:0}
.isl-t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .55s var(--ease),opacity .3s var(--ease)}
.isl-t.out{transform:translateY(-130%);opacity:0}.isl-t.in{transform:translateY(130%);opacity:0;transition:none}
.agent-st{display:none!important}
/* controls */
.seg{border-radius:12px;padding:3px;background:var(--seg)}
.seg button{border-radius:9px}
.seg button.on{box-shadow:0 1px 2px rgba(17,19,38,.08),0 0 0 1px rgba(17,19,38,.04)}
.fb,.btn,.sched{border-radius:10px;box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(17,19,38,.04)}
.fb.set{background:var(--soft);box-shadow:0 0 0 1px #D6D1FF}
.btn.pri{background:var(--acc);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 8px 18px -8px rgba(75,59,255,.8)}
.btn.pri:hover{background:#3F2FF5}
.btn.ghost{box-shadow:inset 0 0 0 1px var(--line2)}
.btn:active,.seg button:active,.fb:active{transform:scale(.97)}
.hint{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute);font-weight:500}.hint .ic{width:14px;height:14px}
.tg{border-radius:6px}
.pl{border-radius:4px;background:var(--chip);font-family:var(--mono);font-weight:500}
.av{font-weight:650;font-size:9.5px}
/* lanes / stages */
.st-idea{--lk:#7B61FF;--lane:#F3F1FF}.st-brief{--lk:#4B3BFF;--lane:#EFEDFF}.st-approved{--lk:#2F5BEA;--lane:#ECF1FE}.st-assets{--lk:#1679D6;--lane:#EAF4FD}.st-editing{--lk:#0B95B8;--lane:#E6F5F9}.st-review{--lk:#10B3A3;--lane:#E6F7F5}.st-posted{--lk:#111326;--lane:#EEEFF3}
.col{background:var(--lane);border-radius:16px;padding:12px 9px 10px}
.col-n{color:var(--ink)}
.col-c{margin-left:auto;font:500 12px var(--mono);color:var(--lk)}
.card{background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--sh),0 0 0 1px rgba(17,19,38,.05);transition:transform .45s var(--spring),box-shadow .35s var(--ease)}
.card:hover{transform:translateY(-2px);box-shadow:var(--sh-l),0 0 0 1px rgba(75,59,255,.18)}
.board .card{cursor:grab}
.card:active{transform:scale(.985);cursor:grabbing}
.card.lifted{opacity:.4;transform:scale(.97)}
.card h3{color:var(--ink);font-weight:650;letter-spacing:-.005em}
.jt,.jf,.jx{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.sp{flex:1}
.jx{padding-top:8px;border-top:1px solid var(--line);justify-content:space-between}
.col{transition:box-shadow .3s var(--ease),background .3s}
.col.over{box-shadow:inset 0 0 0 2px var(--lk),0 18px 34px -24px var(--lk)}
.fresh{position:relative;align-self:flex-start;display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:650;letter-spacing:.01em;color:var(--acc-ink);background:var(--soft);padding:3px 8px 3px 6px;border-radius:6px;margin-bottom:-2px}
.fresh .ic{width:12px;height:12px}
.fresh::after{content:"";position:absolute;right:-3px;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 2px #fff}
/* card parts */
.gp-t{display:flex;align-items:center;gap:7px;min-width:0}
.gp-t em{font-style:normal;font-size:11.5px;font-weight:500;color:var(--mute);white-space:nowrap}
.gsrc5{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--ink);padding:2px 8px 2px 6px;border-radius:6px;background:color-mix(in srgb,var(--c) 11%,#fff);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 22%,#fff);white-space:nowrap}
.gsrc5::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--c)}
.prio5{display:inline-flex;align-items:center;gap:5px;font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--mute);white-space:nowrap}
.prio5::before{content:"";width:7px;height:7px;border-radius:1.5px;transform:rotate(45deg);background:var(--line2)}
.prio5.p-Top{color:var(--ink)}.prio5.p-Top::before{background:var(--sun);box-shadow:0 0 0 2px var(--sun-soft)}
.prio5.p-Normal::before{background:#B9B2FF}
.pips{display:flex;align-items:center;gap:8px}
.pips span{flex:1;display:flex;align-items:center}
.pips i{width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line2);flex:none;position:relative}
.pips i+i{margin-left:9px}.pips i+i::before{content:"";position:absolute;right:9px;top:3.5px;width:9px;height:2px;background:var(--line)}
.pips i.f{background:var(--lk,var(--acc));box-shadow:none}
.pips i.f+i.f::before{background:var(--lk,var(--acc))}
.pips em{font:500 11px var(--mono);font-style:normal;color:var(--mute)}
.card .av{width:24px;height:24px}
.t-due{font-weight:500}
/* board: pipeline track */
.board.path{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:auto auto;gap:48px 40px;align-items:stretch;padding:16px 4px 10px}
.bwrap{overflow:visible}
.stop{position:relative;min-width:0;border-radius:16px;padding:14px 12px 14px;background:var(--lane);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--lk) 12%,transparent)}
.stop::before{content:"";position:absolute;left:16px;right:16px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--lk)}
.stop .col-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 4px 10px 36px;min-height:30px}
.stop .col-n{font-weight:750;font-size:17px;letter-spacing:-.02em;color:var(--ink)}

  g=`<rect width="200" height="250" fill="${p[0]}"/><path class="s" d="M38 34h124a20 20 0 0120 20v46a20 20 0 01-20 20H84l-24 20v-20H38a20 20 0 01-20-20V54a20 20 0 0120-20z" fill="${p[1]}"/><rect x="40" y="60" width="96" height="9" rx="4.5" fill="${p[0]}" opacity=".85"/><rect x="40" y="80" width="64" height="9" rx="4.5" fill="${p[0]}" opacity=".6"/>`+bars}
 else if(m==='text'){g=`<rect width="200" height="250" fill="${p[4]}"/><rect x="26" y="78" width="148" height="14" rx="7" fill="${p[0]}"/><rect x="26" y="102" width="112" height="14" rx="7" fill="${p[0]}" opacity=".8"/><rect class="s" x="26" y="126" width="80" height="14" rx="7" fill="${p[2]}"/><text x="26" y="206" fill="${p[1]}" font-family="inherit" font-weight="800" font-size="40">3s</text>`}

function shell(){
 const top=`<header class="top">${O.logoInNav?'':brandBlock()}${O.navInTop?navBlock():''}<div class="top-r"><label class="search">${ic('search')}<input placeholder="Search cards, trends, formats"></label><span class="agent-st"><i class="pulse"></i>Agent online</span><span class="seats">${K.brand.seats.map(s=>`<span class="av av-${s.id}" title="${s.name}, ${s.role}">${s.initials}</span>`).join('')}</span></div></header>`;
 const nav=O.navInTop?'':(O.logoInNav?navBlock().replace('<nav class="nav">','<nav class="nav"><div class="nav-brand">'+brandBlock()+'</div>'):navBlock());
 document.body.innerHTML=`<div class="app nav-${O.nav}">${top}${nav}<main id="view"></main></div><div id="toast"></div><div id="pop"></div>`;}
const head=(t,sub,act)=>`<div class="ph"><div class="ph-t"><h1>${t}</h1>${sub?`<p>${sub}</p>`:''}</div>${act?`<div class="ph-a">${act}</div>`:''}</div>`;
const csub=()=>`${K.cards.length} pieces moving Idea to Posted. ${K.shortPipeline.note}`;
function ctool(){const views=[['board','Board'],['list','List'],['timeline','Timeline'],['calendar','Calendar']];
 const fl=[['type','Type'],['source','Source'],['platform','Platform'],['assignee','Assignee']];
 return `<div class="tool"><div class="seg vs">${views.map(v=>`<button class="${S.screen===v[0]?'on':''}" data-go="${v[0]}">${ic(v[0])}<span>${v[1]}</span></button>`).join('')}</div><div class="filters">${fl.map(f=>{const v=S.f[f[0]];const lab=v==='All'?'All':(f[0]==='assignee'?seat(v).name.split(' ')[0]:v);return `<button class="fb ${v!=='All'?'set':''}" data-menu="f:${f[0]}"><span>${f[1]}</span><b>${lab}</b>${ic('chev')}</button>`}).join('')}</div><button class="btn pri" data-act="new">${ic('plus')}<span>New card</span></button></div>`}

// ---------- screens ----------
const V={};
V.board=()=>head('Content',csub())+ctool()+`<div class="bwrap"><div class="board">${K.stages.map(st=>{const cs=K.cards.filter(c=>c.stage===st.id&&vis(c));return `<section class="col st-${st.id}"><header class="col-h"><span class="col-n">${st.name}</span><span class="col-c">${cs.length}</span></header>${st.note?`<p class="col-note">${st.note}</p>`:''}<div class="col-b">${cs.map((c,i)=>cardEl(c,i)).join('')||`<div class="empty">Nothing here yet</div>`}</div></section>`}).join('')}</div></div>`;
function lrow(c,i){const b=B(c);return `<div class="lrow" data-card="${c.id}" style="view-transition-name:v${c.id};--i:${i}"><span class="lc-t"><b>${c.title}</b><small>${c.type} · ${stageName(c.stage)}${c.daysInStage>=3?` · <em class="lw">${c.daysInStage} days in stage</em>`:''}</small></span><span>${b.pri}</span><span>${b.src}</span><span class="lc-p">${b.prog}<em>${c.tasks[0]}/${c.tasks[1]}</em></span><span class="lc-a">${b.av}<em>${b.s.name.split(' ')[0]}</em></span><span>${b.due}</span></div>`}
V.list=()=>{const g=S.group==='stage'?K.stages.map(s=>[s.name,K.cards.filter(c=>c.stage===s.id&&vis(c))]):['Overdue','Today','This week','Later','Posted'].map(b=>[b,K.cards.filter(c=>bucket(c)===b&&vis(c))]);let n=0;
 return head('Content',csub())+ctool()+`<div class="lwrap"><div class="lgs"><span>Group by</span><div class="seg sm"><button class="${S.group==='stage'?'on':''}" data-group="stage">Stage</button><button class="${S.group==='due'?'on':''}" data-group="due">Due</button></div></div><div class="ltable"><div class="lrow lhead"><span>Card</span><span>Priority</span><span>Source</span><span>Progress</span><span>Assignee</span><span>Due</span></div>${g.map(x=>`<div class="lgrp"><h3>${x[0]}<span>${x[1].length}</span></h3>${x[1].length?x[1].map(c=>lrow(c,n++)).join(''):`<div class="lempty">${x[0]==='Overdue'?'Nothing overdue':'No cards here'}</div>`}</div>`).join('')}</div></div>`};
V.timeline=()=>{const T0='2026-10-27',N=21,t0=D(T0);const X=s=>((D(s)-t0)/864e5)/N*100;
 const days=Array.from({length:N},(_,i)=>new Date(t0.getTime()+i*864e5));
 const cs=K.stages.reduce((a,st)=>a.concat(K.cards.filter(c=>c.stage===st.id&&vis(c))),[]);
 const rows=cs.map(c=>{const b=B(c);let bar;
  if(c.stage==='posted')bar=`<span class="tl-pt" data-card="${c.id}" style="left:${X(c.postedAt)+50/N}%;view-transition-name:v${c.id}"><i></i><em>Posted ${fd(c.postedAt)}</em></span>`;
  else{const st=iso(new Date(D(K.today)-c.daysInStage*864e5));const l=X(st),r=X(c.due)+100/N;
   bar=`<span class="tl-bar pri-${c.priority}" data-card="${c.id}" style="left:${l}%;width:${r-l}%;view-transition-name:v${c.id}"><i style="width:${b.pr}%"></i><em>${c.tasks[0]}/${c.tasks[1]}</em></span>`+(c.slot?`<span class="tl-slot" style="left:${X(c.slot)}%" title="Post slot ${fd(c.slot)}, ${ft(c.slot)}"><i></i><em>${WD[D(c.slot).getDay()]} ${ft(c.slot)}</em></span>`:'')}
  return `<div class="tl-row"><div class="tl-lab">${b.av}<span><b>${c.title}</b><small>${stageName(c.stage)} · ${dueLabel(c)}</small></span></div><div class="tl-track">${bar}</div></div>`}).join('');
 const tx=(X(K.today)+50/N)/100;
 return head('Content',csub())+ctool()+`<div class="tl-leg"><span><i class="lg-bar"></i>In stage until due</span><span><i class="lg-fill"></i>Tasks done</span><span><i class="lg-slot"></i>Post slot</span><span><i class="lg-now"></i>Today, ${fd(K.today)}</span></div><div class="tlw"><div class="tl"><div class="tl-row tl-h"><div class="tl-lab"><small>${MON[t0.getMonth()]} – ${MON[days[N-1].getMonth()]} 2026</small></div><div class="tl-track">${days.map(d=>`<span class="tl-d ${d.getDay()%6===0?'we':''} ${iso(d)===K.today?'now':''}"><b>${d.getDate()}</b><small>${WD[d.getDay()][0]}</small></span>`).join('')}</div></div>${rows}<div class="tl-now" style="left:calc(var(--lab) + (100% - var(--lab)) * ${tx})"><span>Today</span></div></div></div>`};
V.calendar=()=>{const t0=D('2026-10-26');const when=c=>(c.stage==='posted'?c.postedAt:(c.slot||c.due)).slice(0,10);
 const cells=Array.from({length:21},(_,i)=>new Date(t0.getTime()+i*864e5));
 return head('Content',csub())+ctool()+`<div class="cal"><div class="cal-h">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<span>${d}</span>`).join('')}</div><div class="cal-g">${cells.map(d=>{const k=iso(d);const its=K.cards.filter(c=>vis(c)&&when(c)===k);return `<div class="cal-c ${k===K.today?'now':''} ${k<K.today?'past':''}"><b>${d.getDate()===1?MON[d.getMonth()]+' ':''}${d.getDate()}</b>${its.map(c=>`<div class="cal-it so-${c.source}" data-card="${c.id}" style="view-transition-name:v${c.id}"><span>${c.title}</span><small>${c.stage==='posted'?'Posted':c.slot?ft(c.slot)+' slot':'Due'} · ${seat(c.assignee).initials}</small></div>`).join('')}</div>`}).join('')}</div></div>`};

function tcard(t,i){const btns=t.state==='new'?`<button class="btn ghost" data-pass="${t.id}">${ic('x')}<span>Pass</span></button><button class="btn pri" data-pick="${t.id}">${ic('check')}<span>Pick</span></button>`:`<span class="tstate st-${t.state}">${t.state==='picked'?'Picked':'Passed'}</span><button class="btn ghost" data-undo="${t.id}">Undo</button>`;

V.trends=()=>{const its=S.trends.filter(t=>t.state===S.tab);let n=0;

function chart(){const v=K.performance.followersDaily,W=640,H=210,px=10;const mn=Math.min.apply(0,v)-80,mx=Math.max.apply(0,v)+40;
 const X=i=>px+i*(W-2*px)/(v.length-1),Y=n=>H-14-(n-mn)/(mx-mn)*(H-40);let g='';const st=O.chart||'area';
 const line=v.map((n,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(n).toFixed(1)).join(' ');
 const grid=[0,1,2,3].map(k=>`<line x1="0" x2="${W}" y1="${20+k*((H-34)/3)}" y2="${20+k*((H-34)/3)}" class="gl"/>`).join('');
 if(st==='area'||st==='line'){g=grid+(st==='area'?`<path d="${line} L${X(v.length-1)} ${H} L${X(0)} ${H}Z" class="ar"/>`:'')+`<path d="${line}" class="ln"/><circle cx="${X(v.length-1)}" cy="${Y(v[v.length-1])}" r="7" class="end"/>`}
 else if(st==='dots'){g=grid+v.map((n,i)=>`<circle cx="${X(i)}" cy="${Y(n)}" r="${i===v.length-1?8:5}" class="${i===v.length-1?'end':'dt'}"/>`).join('')}
 else{const bw=(W-2*px)/v.length-5;g=v.map((n,i)=>`<rect x="${X(i)-bw/2}" y="${Y(n)}" width="${bw}" height="${H-Y(n)}" rx="${st==='blocks'?3:bw/2}" class="${i===v.length-1?'end':'br'}"/>`).join('')}
 return `<svg class="chart ch-${st}" viewBox="0 0 ${W} ${H}">${g}</svg>`}
V.performance=()=>{const pf=K.performance;const fo=pf.totals[0];const mxp=Math.max.apply(0,pf.byPlatform.map(p=>p.views));const wk=pf.byWeekday;const wmx=Math.max.apply(0,Object.values(wk));
 const post=id=>pf.posts.find(p=>p.card===id);const c10=post('c10');const er=Math.round((c10.likes+c10.comments+c10.shares+c10.saves)/c10.views*1000)/10;
 return head('Performance',`Collectors run ${S.dir.schedule.performance}. Lifetime, this period and the previous period, per platform.`,`<div class="seg rng">${pf.ranges.map(r=>`<button class="${S.range===r?'on':''}" data-range="${r}">${r}</button>`).join('')}</div>`)+(S.range!==pf.range?`<div class="note-bar">${ic('alert')}This sample workspace only has ${pf.range} collected. Showing ${pf.range}.</div>`:'')
 +`<div class="pgrid"><div class="pc kpis">${pf.totals.map((t,i)=>{const d=pct(t.period,t.prev);return `<div class="kpi" style="--i:${i}"><small>${t.k}</small><b>${fmt(t.period)}</b><span class="dl ${d>=0?'up':'dn'}">${ic(d>=0?'up':'down')}${d>=0?'+':''}${d}%<em>vs previous</em></span><em class="lt">${fmt(t.lifetime)} lifetime</em></div>`}).join('')}</div>
 <div class="pc grow"><div class="pc-h"><h3>Follower growth</h3><span>${pf.range}</span></div><div class="big"><b>${num(fo.lifetime)}</b><span class="dl up">${ic('up')}+${num(fo.period)} this period</span></div>${chart()}<div class="ax"><span>Oct 4</span><span>Oct 18</span><span>Nov 2</span></div></div>
 <div class="pc plat"><div class="pc-h"><h3>By platform</h3><span>views</span></div>${pf.byPlatform.map(p=>`<div class="pp"><div class="pp-t"><b>${p.p}</b><span>${fmt(p.views)} views · ${fmt(p.followers)} followers</span></div><span class="pbar"><i style="width:${p.views/mxp*100}%"></i></span></div>`).join('')}</div>
 <div class="pc wk"><div class="pc-h"><h3>Best weekday</h3><span>vs average</span></div><div class="wks">${Object.keys(wk).map(d=>`<div class="wd ${wk[d]===wmx?'best':''}"><em>${wk[d]}×</em><span><i style="height:${wk[d]/wmx*100}%"></i></span><b>${d}</b></div>`).join('')}</div></div>
 <div class="pc hl"><div class="pc-h"><h3>Highlights</h3></div><div class="hls"><div class="hli"><small>Most viewed</small><b>${card(pf.highlights.mostViewed).title}</b><span>${fmt(post('c9').views)} views on TikTok</span></div><div class="hli"><small>Best engagement</small><b>${card(pf.highlights.bestEngagement).title}</b><span>${er}% engaged on Instagram</span></div><div class="hli lo"><small>Lowest</small><b>${card(pf.highlights.lowest).title}</b><span>${card(pf.highlights.lowest).type} · ${card(pf.highlights.lowest).platforms.join(', ')}</span></div></div></div>
 <div class="pc tops"><div class="pc-h"><h3>Top posts</h3><span>× your median</span></div><div class="tp"><div class="tpr tph"><span>Post</span><span>Views</span><span>Likes</span><span>Comments</span><span>Shares</span><span>Saves</span><span></span></div>${pf.posts.map(p=>`<div class="tpr"><span><b>${card(p.card).title}</b><small>${p.platform}</small></span><span>${fmt(p.views)}</span><span>${fmt(p.likes)}</span><span>${fmt(p.comments)}</span><span>${fmt(p.shares)}</span><span>${fmt(p.saves)}</span><span class="xm ${p.vsMedian>=1?'hi':'lo'}">${p.vsMedian}×</span></div>`).join('')}</div></div>

 const stops=K.stages.map((st,si)=>{const cs=K.cards.filter(c=>c.stage===st.id&&vis(c));const o=ORD[st.id];
  return `<section class="col st-${st.id} stop ${st.id==='posted'?'finish':''}" style="grid-row:${o[0]};grid-column:${o[1]}"><span class="snum">${String(si+1).padStart(2,'0')}</span>${LINK[st.id]?`<span class="road road-${LINK[st.id]}"><i></i></span>`:''}<header class="col-h"><span class="col-n">${st.name}</span>${st.note?`<span class="col-note">${st.note}</span>`:''}<span class="col-c">${cs.length}</span></header>${st.id==='posted'?'<span class="flag"></span>':''}<div class="col-b">${cs.map((c,i)=>cardEl(c,i)).join('')||`<div class="empty">Nothing here yet</div>`}</div></section>`}).join('');
 const start=`<section class="start" style="grid-row:2;grid-column:1"><span class="start-t">Line status</span><b>${live} in flight</b><span class="start-s">${done} reached Posted this week</span>${stuck.length?`<div class="stk"><small>${ic('alert')}Stuck 3+ days</small>${stuck.map(c=>`<button data-card="${c.id}" class="stk-i"><span class="av av-${c.assignee}">${seat(c.assignee).initials}</span><span>${c.title}</span><em>${c.daysInStage}d</em></button>`).join('')}</div>`:'<p class="start-s">Nothing is stuck.</p>'}<div class="legend">${Object.keys(SC5).map(k=>`<span><i style="--c:${SC5[k]}"></i>${k}</span>`).join('')}</div></section>`;
 return head('Content',csub())+ctool()+`<div class="bwrap"><div class="board path">${stops}${start}</div></div>`};
// list: scoreboard
function lrow5(c,i,r){const b=B(c);const n=c.stage==='posted'?null:dd(c.due,K.today);const urg=n===null?'done':n<0?'late':n===0?'today':n<=2?'soon':'';
 return `<div class="lrow sb st-${c.stage}" data-card="${c.id}" style="view-transition-name:v${c.id};--i:${i}"><span class="rank">${r}</span><span class="lc-t"><b>${c.title}</b><small><i class="sdot5"></i>${c.type} · ${stageName(c.stage)}${c.daysInStage>=3&&c.stage!=='posted'?` · <em class="lw">${c.daysInStage} days in stage</em>`:''}</small></span><span><span class="prio5 p-${c.priority}">${c.priority}</span></span><span><span class="gsrc5" style="--c:${SC5[c.source]}">${c.source}</span></span><span class="mpath"><span>${Array.from({length:c.tasks[1]},(_,k)=>`<i class="${k<c.tasks[0]?'f':''}"></i>`).join('')}</span><em>${c.tasks[0]}/${c.tasks[1]}</em></span><span class="lc-a">${b.av}<em>${b.s.name.split(' ')[0]}</em></span><span><span class="due5 u-${urg}">${dueLabel(c)}</span></span></div>`}
V.list=()=>{const GC={Overdue:'#D93A4A',Today:'#4B3BFF','This week':'#C98500',Later:'#1679D6',Posted:'#0A8478'};const PR={Top:0,Normal:1,Later:2};
 const g=S.group==='stage'?K.stages.map((s,i)=>[s.name,K.cards.filter(c=>c.stage===s.id&&vis(c)),STC5[s.id],'Stage '+String(i+1).padStart(2,'0')]):['Overdue','Today','This week','Later','Posted'].map(x=>[x,K.cards.filter(c=>bucket(c)===x&&vis(c)),GC[x],'']);let n=0;
 return head('Content',csub())+ctool()+`<div class="lwrap"><div class="lgs"><span>Group by</span><div class="seg sm"><button class="${S.group==='stage'?'on':''}" data-group="stage">Stage</button><button class="${S.group==='due'?'on':''}" data-group="due">Due</button></div></div><div class="ltable board5"><div class="lrow lhead sb"><span>#</span><span>Card</span><span>Priority</span><span>Source</span><span>Progress</span><span>Assignee</span><span>Due</span></div>${g.map(x=>{const cs=x[1].slice().sort((a,b)=>PR[a.priority]-PR[b.priority]);return `<div class="lgrp" style="--gc:${x[2]}"><h3><span class="lvl">${x[3]?`<small>${x[3]}</small>`:''}${x[0]}</span><span class="lvl-c">${cs.length}</span><span class="lvl-r"></span></h3>${cs.length?cs.map((c,k)=>lrow5(c,n++,k+1)).join(''):`<div class="lempty">${x[0]==='Overdue'?'Nothing overdue':'No cards here'}</div>`}</div>`}).join('')}</div></div>`};
// timeline: race track
V.timeline=()=>{const T0='2026-10-27',N=21,t0=D(T0);const X=s=>((D(s)-t0)/864e5)/N*100;
 const days=Array.from({length:N},(_,i)=>new Date(t0.getTime()+i*864e5));
 const cs=K.stages.reduce((a,st)=>a.concat(K.cards.filter(c=>c.stage===st.id&&vis(c))),[]);
 const rows=cs.map(c=>{const b=B(c);let bar;
  if(c.stage==='posted'){const x=X(c.postedAt)+50/N;bar=`<span class="fin-pt" data-card="${c.id}" style="left:${x}%;view-transition-name:v${c.id}"><i class="chk"></i><em>Posted ${fd(c.postedAt)}</em></span>`}
  else{const st=iso(new Date(D(K.today)-c.daysInStage*864e5));const l=X(st),r=X(c.due)+100/N;
   bar=`<span class="race" data-card="${c.id}" style="left:${l}%;width:${r-l}%;view-transition-name:v${c.id}"><span class="trail" style="width:${b.pr}%"></span><span class="tok av-${c.assignee}" style="left:${b.pr}%">${seat(c.assignee).initials}</span><i class="chk fin"></i></span>`+(c.slot?`<span class="slot5" style="left:${X(c.slot)}%" title="Post slot ${fd(c.slot)}, ${ft(c.slot)}"><i></i><em>${WD[D(c.slot).getDay()]} ${ft(c.slot)}</em></span>`:'')}
  return `<div class="tl-row lane st-${c.stage}"><div class="tl-lab"><span class="lane-n">${c.tasks[0]}/${c.tasks[1]}</span><span><b>${c.title}</b><small><i class="sdot5"></i>${stageName(c.stage)} · ${dueLabel(c)}</small></span></div><div class="tl-track">${bar}</div></div>`}).join('');
 const tx=(X(K.today)+50/N)/100;
 return head('Content',csub())+ctool()+`<div class="tl-leg"><span><i class="lg-trail"></i>Tasks done</span><span><i class="lg-tok"></i>Owner</span><span><i class="lg-chk"></i>Due</span><span><i class="lg-slot5"></i>Post slot</span><span><i class="lg-flag"></i>Today, ${fd(K.today)}</span></div><div class="tlw track5"><div class="tl"><div class="tl-row tl-h"><div class="tl-lab"><small>${MON[t0.getMonth()]} – ${MON[days[N-1].getMonth()]} 2026</small></div><div class="tl-track">${days.map(d=>`<span class="tl-d ${d.getDay()%6===0?'we':''} ${iso(d)===K.today?'now':''}"><b>${d.getDate()}</b><small>${WD[d.getDay()].slice(0,2)}</small></span>`).join('')}</div></div>${rows}<div class="tl-now ckpt" style="left:calc(var(--lab) + (100% - var(--lab)) * ${tx})"><span>Today</span></div></div></div>`};
// calendar: board-game tiles
V.calendar=()=>{const t0=D('2026-10-26');const when=c=>(c.stage==='posted'?c.postedAt:(c.slot||c.due)).slice(0,10);
 const TT=['#DDF6EE','#FFF1D6','#FFE2E6','#E3EEFC','#F0E8F8'];
 const cells=Array.from({length:21},(_,i)=>new Date(t0.getTime()+i*864e5));
 return head('Content',csub())+ctool()+`<div class="cal tiles"><div class="cal-h">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<span>${d}</span>`).join('')}</div><div class="cal-g">${cells.map((d,i)=>{const k=iso(d);const its=K.cards.filter(c=>vis(c)&&when(c)===k);return `<div class="cal-c ${k===K.today?'now':''} ${k<K.today?'past':''}" style="--tt:${TT[(i*2+Math.floor(i/7))%5]};--i:${i}"><b class="tn">${d.getDate()}${d.getDate()===1||i===0?` <small>${MON[d.getMonth()]}</small>`:''}</b>${k===K.today?'<span class="here"><i></i>Today</span>':''}${its.map(c=>`<div class="cal-it so-${c.source}" data-card="${c.id}" style="view-transition-name:v${c.id};--c:${SC5[c.source]}"><span>${c.title}</span><small>${c.stage==='posted'?'Posted':c.slot?ft(c.slot)+' slot':'Due'} · ${seat(c.assignee).initials}</small></div>`).join('')}</div>`}).join('')}</div></div>`};
// telegram: move log
V.telegram=()=>{const c9=K.performance.posts[0];const t1=S.trends.find(x=>x.id==='t1');
 const mv=(n,who,said,title,body,go,lab)=>`<div class="mv" style="--i:${n}"><span class="mv-n">${n}</span><div class="mv-b"><small>${String(n).padStart(2,'0')} · ${who}</small><q>${said}</q><b>${title}</b>${body}<button class="lnk" data-go="${go}">${lab}${ic('arrow')}</button></div></div>`;
 return head('Agent','Your team runs Engagent from Telegram. '+K.product.line,`<span class="sched"><i class="pulse"></i>Connected to Fernhouse Coffee</span>`)+`<div class="tg5"><div class="moves"><h2>Message log</h2><p class="mv-sub">Every message in the chat is a stop on the line. Here is where each one landed.</p>
 ${mv(1,'you',K.telegram[0].text,'Directions updated','<div class="chips"><span class="chip">'+ic('hash')+'#cafevibes</span><span class="chip neg">'+ic('ban')+'giveaway bots</span></div>','directions','Open Directions')}
 ${mv(2,'agent',K.telegram[2].text,'Trend found: '+t1.title,`<p>${fmt(t1.views)} views · ${t1.outlier}× outlier · ${t1.difficulty} flip</p>`,'trends','See this week\'s trends')}
 ${mv(3,'you',K.telegram[3].text,'Card added to Idea',`<div class="fx-card">${cardEl(card('c1'),0,false)}</div>`,'board','Open the board')}
 ${mv(4,'you',K.telegram[5].text,'Post logged',`<div class="logged5"><span><em>Views</em><b>${fmt(c9.views)}</b></span><span><em>Likes</em><b>${fmt(c9.likes)}</b></span><span class="xm hi">${c9.vsMedian}× median</span></div>`,'performance','Open Performance')}
 <div class="mv mv-end"><span class="mv-n">${ic('send')}</span><div class="mv-b"><b>Your turn</b><p>Ask for this week's best flip, or tell it what to stop watching.</p></div></div></div>
 <div class="phone"><div class="ph-bar"><span class="tg-av">${O.agentAv}</span><span><b>Engagent</b><small>bot · Fernhouse Coffee</small></span></div><div class="chat">${K.telegram.map(msg).join('')}</div><div class="ph-in"><span>Message</span>${ic('send')}</div></div></div>`};

shell();if(!THUMB){document.documentElement.classList.add('intro');setTimeout(()=>document.documentElement.classList.remove('intro'),1600)}render(false);
})();
</script>
</body></html>
